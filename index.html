<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ארכיון הקלטות | חודש החדשנות וה-AI בקק"ל</title>
    
    <!-- תגיות Meta לתצוגה מקדימה -->
    <meta property="og:title" content="ארכיון הקלטות | חודש החדשנות וה-AI בקק״ל" />
    <meta property="og:description" content="פספסתם מפגש? כל ההקלטות מסדרת הבינה המלאכותית של קק״ל זמינות כעת לצפייה ישירה." />
    <meta property="og:image" content="https://res.cloudinary.com/dfiw5e2xo/image/upload/v1772104188/212_i9jmfi.jpg" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ארכיון הקלטות | חודש החדשנות וה-AI בקק״ל" />
    <meta name="twitter:description" content="כל ההקלטות מסדרת הבינה המלאכותית של קק״ל זמינות כעת לצפייה ישירה." />
    <meta name="twitter:image" content="https://res.cloudinary.com/dfiw5e2xo/image/upload/v1772104188/212_i9jmfi.jpg" />

    <!-- טעינת Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- הגדרות פונטים -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Heebo', sans-serif; }
        
        /* רקע חדשני - כחול עמוק משולב */
        .tech-bg {
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(213, 89%, 20%, 1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(142, 70%, 15%, 1) 0, transparent 50%), 
                radial-gradient(at 100% 100%, hsla(213, 89%, 20%, 1) 0, transparent 50%);
            color: white;
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-card-hover:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
    </style>

    <!-- Import Map & React -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.344.0"
        }
    }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="tech-bg min-h-screen">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Sparkles, Presentation, TableProperties, Music, Cpu, Bot, Briefcase,
            Volume2, Play, Video
        } from 'lucide-react';

        const KKLRecordingsArchive = () => {
            const [isVideoMuted, setIsVideoMuted] = useState(true);
            const videoRef = useRef(null);

            const kklLogoUrl = "https://res.cloudinary.com/dhzuwoech/image/upload/v1771425452/KakalLogo.svg_lxtqlq.png";

            const colors = {
                blue: '#0072CE',    
                green: '#39B54A',   
                brown: '#a67c52',   
                pink: '#FF4081'  
            };

            const recordings = [
                {
                    id: 1, 
                    title: "היכרות עם כלי בינה מלאכותית",
                    link: "https://us02web.zoom.us/rec/share/GNpZyRdb702TPqe1zNa-4AZ8RmXKMs2uHevPqfhRffOLVAdXRjLZEZOOAziW0zhu.vor08tL21xvjODb8?startTime=1773048328000",
                    icon: <Sparkles className="w-8 h-8" />, color: colors.blue
                },
                {
                    id: 2, 
                    title: "מצגות ופרזנטציה עם בינה מלאכותית",
                    link: "https://us02web.zoom.us/rec/share/SrfYqbYea14wH-f82tqRW-qrXsTA3HaUkbihKkafA2EarkcYEPXwLIc6B8vbnarn.RpS8w33fVh0cDPJl?startTime=1773308856000",
                    icon: <Presentation className="w-8 h-8" />, color: colors.green
                },
                {
                    id: 3, 
                    title: "בינה מלאכותית ואקסלים",
                    link: "https://us02web.zoom.us/rec/share/UiCy8DsgjwNqYiHoDeHpYHUr2kno9MOPlG9CFDWkxOs7f2pgfQuIM2KfD7qvVOo.yG2yZME6w6AS5yI_?startTime=1773563474000",
                    icon: <TableProperties className="w-8 h-8" />, color: colors.brown
                },
                {
                    id: 4, 
                    title: "יצירת תמונות וידאו ומוזיקה",
                    link: "https://us02web.zoom.us/rec/share/sakxYMe4hHzUxWfKU7EJJVKbCckA3FSCH849ASKlZ4DRQvHdrncRG_B50_n2SoPx.Hy6YftJ66dyIWyuy?startTime=1773913507000",
                    icon: <Music className="w-8 h-8" />, color: colors.pink
                },
                {
                    id: 5, 
                    title: "אוטומציה - לתת למחשב לעבוד בשבילך",
                    link: "https://us02web.zoom.us/rec/share/CBuNaA3TzidJUOGy6VeCubTh0d02-OgvLbpzBEjndkXSnGeUHx1z9fYWbCPfqHQO.s2CLFA6wD4-598Bn?startTime=1774259089000",
                    icon: <Cpu className="w-8 h-8" />, color: colors.blue
                },
                {
                    id: 6, 
                    title: "סוכני AI עובדים דיגיטליים לצידכם",
                    link: "https://us02web.zoom.us/rec/share/svKeZdZaOt1uuG2FLZKUlMHLlryS4OOgw2AIRapYaf-nUtD1z0l2oo_Q4OM4-KMB.SJIrnej8uRwWSO23?startTime=1774518133000",
                    icon: <Bot className="w-8 h-8" />, color: colors.green
                },
                {
                    id: 7, 
                    title: "קופיילוט העוזר החכם שלכם בתוך אופיס",
                    link: "https://us02web.zoom.us/rec/share/wkm87LclsaXxPqsginxNt0IhtqbRO847wSmu3ertHzHMLF_IL-66_qwnzYdt2AXj.OuUiK1rx8hBqMUKZ?startTime=1774858725000",
                    icon: <Briefcase className="w-8 h-8" />, color: colors.brown
                }
            ];

            // Handle Unmute Action
            const handleUnmute = () => {
                if (videoRef.current) {
                    videoRef.current.muted = false;
                    videoRef.current.volume = 1;
                    setIsVideoMuted(false);
                }
            };

            return (
                <div className="min-h-screen pb-12 flex flex-col">
                    
                    {/* Navbar */}
                    <nav className="w-full z-40 bg-[#0f172a]/95 backdrop-blur-md border-b border-white/10 shadow-lg sticky top-0">
                        <div className="container mx-auto px-6 py-3 flex justify-between items-center">
                            <div className="bg-white/95 px-3 py-1.5 rounded-lg shadow-sm">
                                <img src={kklLogoUrl} alt="KKL Logo" className="h-8 w-auto" />
                            </div>
                            <div className="text-slate-300 text-sm font-medium flex items-center gap-2">
                                <Video className="w-4 h-4 text-green-400" />
                                ארכיון הקלטות
                            </div>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <header className="pt-16 pb-12 relative overflow-hidden flex-shrink-0">
                        <div className="absolute top-20 right-[-10%] w-96 h-96 bg-blue-500/20 rounded-full blur-[100px] pointer-events-none"></div>
                        <div className="absolute bottom-10 left-[-10%] w-80 h-80 bg-green-500/10 rounded-full blur-[100px] pointer-events-none"></div>

                        <div className="container mx-auto px-6 relative z-10 text-center">
                            
                            {/* Main Video Container with Custom Unmute Strip */}
                            <div className="flex justify-center mb-8">
                                <div className="bg-white/10 p-2 rounded-3xl shadow-[0_0_40px_rgba(255,255,255,0.1)] w-full max-w-3xl relative overflow-hidden backdrop-blur-sm border border-white/20 group">
                                    <video 
                                        ref={videoRef}
                                        src="https://res.cloudinary.com/dfiw5e2xo/video/upload/v1772098900/Kakal_v2_njrekk.mp4" 
                                        autoPlay 
                                        muted
                                        loop
                                        controls
                                        playsInline
                                        className="w-full rounded-2xl shadow-lg"
                                        onVolumeChange={(e) => setIsVideoMuted(e.target.muted || e.target.volume === 0)}
                                    >
                                        הדפדפן שלך אינו תומך בהצגת וידאו.
                                    </video>
                                    
                                    {/* Top Strip Unmute Button */}
                                    {isVideoMuted && (
                                        <div className="absolute top-4 left-0 right-0 z-10 flex justify-center pointer-events-none transition-opacity duration-300">
                                            <button 
                                                onClick={handleUnmute}
                                                className="pointer-events-auto bg-[#0072CE]/90 hover:bg-[#0072CE] text-white px-4 py-2 rounded-full font-medium text-sm md:text-base flex items-center gap-2 shadow-lg backdrop-blur-md animate-bounce transform transition-transform hover:scale-105"
                                            >
                                                <Volume2 className="w-5 h-5" />
                                                לחצו להפעלת סאונד
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                            
                            <h1 className="text-4xl md:text-6xl font-black leading-tight mb-4">
                                בינה בכל פינה <br/>
                                <span className="text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-blue-400">
                                    אביב של חדשנות
                                </span>
                            </h1>

                            <div className="max-w-2xl mx-auto">
                                <p className="text-lg text-slate-300 leading-relaxed font-light">
                                    פספסתם מפגש? רוצים לחזור שוב על החומר? <br/>
                                    ריכזנו עבורכם את כל ההקלטות של סדרת המפגשים במקום אחד.
                                </p>
                            </div>
                        </div>
                    </header>

                    {/* Recordings Grid Section */}
                    <section className="py-8 flex-grow">
                        <div className="container mx-auto px-6 max-w-6xl">
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {recordings.map((rec) => (
                                    <div key={rec.id} className="glass-card glass-card-hover rounded-2xl p-6 flex flex-col items-center text-center h-full relative overflow-hidden group">
                                        {/* Decorative colored glow behind icon */}
                                        <div 
                                            className="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-32 blur-[50px] opacity-20 rounded-full pointer-events-none transition-opacity group-hover:opacity-40"
                                            style={{backgroundColor: rec.color}}
                                        ></div>

                                        <div className="mb-4 mt-2">
                                            <div 
                                                className="w-16 h-16 rounded-2xl flex items-center justify-center text-white shadow-lg mx-auto"
                                                style={{backgroundColor: rec.color}}
                                            >
                                                {rec.icon}
                                            </div>
                                        </div>
                                        
                                        <div className="text-sm font-bold text-slate-400 mb-2">
                                            מפגש {rec.id}
                                        </div>
                                        
                                        <h3 className="font-bold text-xl text-slate-100 mb-6 px-2 flex-grow">
                                            {rec.title}
                                        </h3>
                                        
                                        <a 
                                            href={rec.link} 
                                            target="_blank" 
                                            rel="noopener noreferrer"
                                            className="w-full mt-auto inline-flex items-center justify-center gap-2 bg-white/10 hover:bg-white/20 border border-white/20 text-white px-6 py-3 rounded-xl font-medium transition-all group-hover:bg-[#0072CE] group-hover:border-[#0072CE] group-hover:shadow-[0_0_15px_rgba(0,114,206,0.5)]"
                                        >
                                            <Play className="w-5 h-5" />
                                            צפייה בהקלטה
                                        </a>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="text-center pt-12 pb-6 border-t border-white/10 text-slate-400 text-sm mt-auto">
                        <div className="inline-block bg-white/90 p-3 rounded-xl mb-4">
                             <img src={kklLogoUrl} alt="KKL" className="h-8 mx-auto" />
                        </div>
                        <div>© כל הזכויות שמורות לקרן קימת לישראל</div>
                    </footer>

                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<KKLRecordingsArchive />);
    </script>
</body>
</html>
